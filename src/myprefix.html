<!doctype html>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* WIP banner: pinned to top of viewport, above Scribble's fixed sidebar */
  .jayret-wip-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10000;
    height: 2.5rem;
    box-sizing: border-box;
    background: #fffbcc;
    border-bottom: 2px solid #e6c800;
    color: #5a4700;
    font: 0.85rem/2.5rem -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 0 1rem;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .jayret-wip-banner a { color: #0066cc; text-decoration: underline; }
  .jayret-wip-banner strong { font-weight: 700; }

  /* Push Scribble's fixed/absolute chrome below the banner.
     .navsettop on desktop is the fixed search/toggle bar over the
     sidebar header — it sits at top:0 and would be covered by the
     banner unless pushed down too. */
  .tocset      { top: 2.5rem !important; }
  .navsettop   { top: 2.5rem !important; }
  .versionbox  { top: 2.75rem !important; }
  .maincolumn  { margin-top: 6.5rem !important; }
  @media all and (max-width: 720px) {
    .versionbox { top: 7rem !important; }
    .maincolumn { margin-top: 9.5rem !important; }
  }
</style>
<div class="jayret-wip-banner">
  <strong>Work in progress:</strong> pages still show Pyret syntax. See
  <a href="https://github.com/jayret-lang/jayret-lang/blob/main/docs/jayret-spec.md">jayret-spec.md</a>
  for current Jayret syntax.
  &nbsp;·&nbsp; <a href="https://jayret-lang.github.io/">Home</a>
  &nbsp;·&nbsp; <a href="https://code.jayret.org/">Playground</a>
</div>
